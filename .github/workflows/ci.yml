name: Unit Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'smap/**'
      - 'tests/**'
      - 'tools/testing/vtest/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'smap/**'
      - 'tests/**'
      - 'tools/testing/vtest/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<81"
          pip install -r requirements.txt
          pip install coverage unittest-xml-reporting==3.1.0

      - name: Install package in editable mode
        run: pip install -e .
      
      - name: Run unit tests and generate coverage
        run: |
          # Run tests with xmlrunner and collect coverage for the package.
          coverage run --source=smap -m xmlrunner discover -s tests -p "[vu]test*.py" -o test-results
          # Generate the coverage XML report.
          coverage xml

      - name: Generate coverage badge
        run: |
          # Generate the coverage badge SVG.
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          coverage = float(root.attrib.get("line-rate", "0")) * 100
          percent = f"{coverage:.0f}%"

          if coverage >= 90:
              color = "#4c1"
          elif coverage >= 75:
              color = "#97ca00"
          elif coverage >= 60:
              color = "#dfb317"
          else:
              color = "#e05d44"

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="106" height="20" role="img" aria-label="coverage: {percent}">
            <title>coverage: {percent}</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r"><rect width="106" height="20" rx="3" fill="#fff"/></clipPath>
            <g clip-path="url(#r)">
              <rect width="63" height="20" fill="#555"/>
              <rect x="63" width="43" height="20" fill="{color}"/>
              <rect width="106" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
              <text aria-hidden="true" x="325" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="530">coverage</text>
              <text x="325" y="140" transform="scale(.1)" fill="#fff" textLength="530">coverage</text>
              <text aria-hidden="true" x="835" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="330">{percent}</text>
              <text x="835" y="140" transform="scale(.1)" fill="#fff" textLength="330">{percent}</text>
            </g>
          </svg>
          '''

          Path("coverage.svg").write_text(svg, encoding="utf-8")
          print(f"Wrote coverage.svg for coverage {percent}")
          PY

      - name: Upload test results (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}-${{ github.run_id }}
          path: test-results/

      - name: Upload coverage badge (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge-${{ matrix.python-version }}-${{ github.run_id }}
          path: coverage.svg

      # Install pandoc.
      - name: Install pandoc
        run: sudo apt-get install pandoc

      # Deploy only once for Python 3.9.
      - name: Prepare README for GitHub Pages
        if: ${{ matrix.python-version == '3.9' }}
        run: |
          mkdir -p gh-pages-folder
          pandoc README.md -o gh-pages-folder/index.html
          cp coverage.svg gh-pages-folder/coverage.svg

      - name: Deploy to GitHub Pages
        if: ${{ matrix.python-version == '3.9' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages-folder
          commit_message: "Update README for GitHub Pages"
