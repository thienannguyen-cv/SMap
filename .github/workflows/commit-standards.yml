name: Commit Standards

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, "codex/**" ]
  workflow_dispatch:

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit subjects
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            head="${{ github.sha }}"
            base="${head}~1"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9][a-z0-9-]*\))?!?: .+'
          failed=0

          while IFS= read -r subject; do
            [[ -z "$subject" ]] && continue
            [[ "$subject" == Merge\ * ]] && continue
            [[ "$subject" == Revert\ * ]] && continue

            if ! [[ "$subject" =~ $pattern ]]; then
              echo "::error::Invalid commit subject: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format=%s "${base}..${head}")

          exit "$failed"
