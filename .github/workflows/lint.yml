name: Lint

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/lint.yml"
      - ".pylintrc"
      - "smap/**"
      - "tests/**"
      - "tools/testing/hdvo/exec/**"
  push:
    branches: [ main, "codex/**" ]
    paths:
      - ".github/workflows/lint.yml"
      - ".pylintrc"
      - "smap/**"
      - "tests/**"
      - "tools/testing/hdvo/exec/**"
  workflow_dispatch:

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt
          pip install -e .
          pip install pylint

      - name: Run pylint soft gate
        continue-on-error: true
        run: pylint smap tests tools/testing/hdvo/exec --rcfile=.pylintrc
