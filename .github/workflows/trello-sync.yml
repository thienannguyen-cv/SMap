name: Sync bugs to Trello

# One-way sync: active_bugs.md -> Trello. Runs when the bug catalogue changes
# on main, or on demand. Trello credentials live in repository secrets.
# When active_bugs.md itself changes on a push, it also pings Discord #bugs
# (via DISCORD_BUGS_WEBHOOK_URL) so the team sees the change alongside the card.
on:
  push:
    branches: [main]
    paths:
      - active_bugs.md
      - tools/trello_sync/sync_bugs.py
      - .github/workflows/trello-sync.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (parse and print, no writes)"
        type: boolean
        default: false
      archive_removed:
        description: "Archive cards for bugs removed from active_bugs.md"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: trello-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history so we can diff this push against its predecessor to tell
          # whether active_bugs.md (vs only sync_bugs.py / the workflow) changed.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sync active_bugs.md to Trello
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          TRELLO_BOARD: ${{ secrets.TRELLO_BOARD }}
          TRELLO_LIST_NAME: ${{ vars.TRELLO_LIST_NAME }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.archive_removed }}" = "true" ]; then ARGS="$ARGS --archive-removed"; fi
          python tools/trello_sync/sync_bugs.py $ARGS

      - name: Detect active_bugs.md change
        id: detect
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          # New branch / unknown parent (all-zero SHA): the path filter already
          # gated this run, so treat active_bugs.md as changed.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qx 'active_bugs.md'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping #bugs on Discord
        if: github.event_name == 'push' && steps.detect.outputs.changed == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_BUGS_WEBHOOK_URL }}
          URL: ${{ github.event.head_commit.url }}
          ACTOR: ${{ github.event.head_commit.author.username }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_BUGS_WEBHOOK_URL not set — skipping."; exit 0
          fi
          # Approximate open-bug count: catalogue rows start with "| **".
          COUNT=$(grep -cE '^\| \*\*' active_bugs.md || true)
          URL_LINK="${URL:-}"
          if [ -z "$URL_LINK" ]; then URL_LINK="https://github.com/${REPO}"; fi
          ACTOR_NAME="${ACTOR:-}"
          payload=$(jq -n \
            --arg url "$URL_LINK" \
            --arg actor "$ACTOR_NAME" \
            --arg msg "${COMMIT_MSG:-}" \
            --arg repo "$REPO" \
            --arg count "$COUNT" \
            '{
              username: "SMap Bugs",
              embeds: [{
                title: "🐞 active_bugs.md updated",
                url: $url,
                color: 15158332,
                fields: [
                  { name: "By", value: (if $actor == "" then "—" else $actor end), inline: true },
                  { name: "Open bug rows", value: (if $count == "" then "—" else $count end), inline: true },
                  { name: "Commit", value: (($msg | split("\n")[0] | .[0:200]) | if . == "" then "—" else . end) }
                ],
                footer: { text: $repo }
              }]
            }')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$payload" "$WEBHOOK"
