<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1740" height="840" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1160" height="560" fill="#FFFFFF"/>
  <!-- axes -->
  <line x1="95" y1="70" x2="95" y2="470" stroke="#6B7280" stroke-width="2"/>
  <line x1="95" y1="470" x2="865" y2="470" stroke="#6B7280" stroke-width="2"/>
  <!-- y axis label -->
  <text x="-270" y="40" transform="rotate(-90)" font-size="17" fill="#6B7280" font-weight="bold">CHI PHÍ</text>
  <!-- production cost line (descending) navy -->
  <line x1="135" y1="95" x2="825" y2="440" stroke="#1E2761" stroke-width="5"/>
  <!-- trust scarcity line (ascending) amber -->
  <line x1="135" y1="440" x2="825" y2="95" stroke="#C8860A" stroke-width="5"/>
  <!-- crossing point -->
  <circle cx="480" cy="267" r="8" fill="#111111"/>
  <line x1="480" y1="267" x2="480" y2="470" stroke="#9AA0AC" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="480" y="255" font-size="16" fill="#111111" font-weight="bold" text-anchor="middle">Nút thắt đổi chủ</text>
  <!-- endpoint labels -->
  <text x="872" y="445" font-size="18" fill="#1E2761" font-weight="bold">Chi phí SẢN XUẤT code</text>
  <text x="872" y="100" font-size="18" fill="#A6700A" font-weight="bold">Khan hiếm của NIỀM TIN</text>
  <text x="872" y="120" font-size="15" fill="#6B7280">(nút thắt mới)</text>
  <!-- x axis tick labels -->
  <text x="135" y="495" font-size="16" fill="#374151" text-anchor="middle">Kỉ nguyên nhân lực</text>
  <text x="135" y="514" font-size="14" fill="#9AA0AC" text-anchor="middle">(người viết code)</text>
  <text x="760" y="495" font-size="16" fill="#374151" text-anchor="middle">Kỉ nguyên AI</text>
  <text x="760" y="514" font-size="14" fill="#9AA0AC" text-anchor="middle">(agent sinh code)</text>
</svg>
