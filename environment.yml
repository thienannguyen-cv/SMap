name: smap_env # Name of the Conda environment to be created
channels:
  - pytorch
  - nvidia
  - defaults

dependencies:
  - python=3.9 # Or your desired Python version (e.g., 3.10, 3.11)
  
  # Dependencies from your requirements.txt
  - jupyterlab>=3.4.3
  - numpy==1.26.4
  - pandas
  - scikit-learn
  - matplotlib
  - tqdm
  
  # PyTorch with CUDA (updated versions)
  - pytorch=2.0.1
  - pytorch-cuda=11.8 # Set to CUDA 11.8